services:
  postgres:
    image: postgres:17
    container_name: pg-progetto
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg-data:/var/lib/postgresql/data
    networks:
      - rete_pg

volumes:
  pg-data:

networks:
  rete_pg:
    external: true
